name: Update apps data

on:
  schedule:
    - cron: "30 21 * * *" # S1: daily 21:30 UTC = 3:00 AM IST
  workflow_dispatch: # S2: manual run

permissions:
  contents: write # S5

concurrency:
  group: update-apps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04 # pinned so the ubuntu-latest -> 26 migration can't surprise us
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # node24 runtime

      - uses: actions/setup-node@v7 # node24 runtime
        with:
          node-version: 24 # Node 20 is EOL; 24 is current LTS
          cache: npm

      - run: npm ci

      # Exits non-zero (workflow fails) if Google fails; old apps.json stays untouched.
      - run: node fetch-apps.js
        env:
          DEV_ID: JEWEALITY

      # S4: stage only apps.json; commit + push only if it changed.
      - name: Commit if changed
        id: commit
        run: |
          git add public/apps.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "apps-bot"
          git config user.email "apps-bot@users.noreply.github.com"
          git commit -m "chore: update apps.json"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # jsDelivr caches @main for up to 12h; purge so the CDN URL serves new data right away.
      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          sleep 10
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/public/apps.json" || echo "Purge failed (non-fatal)"
